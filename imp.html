        // ================================================================
        // MUSIC (fixed – plays audio, visualizer works, folder import works)
        // ================================================================
        let musicAudio = null; // will be created per song
        let musicPlaying = false;
        let musicProgressInterval = null;
        let musicSongs = [];
        let currentSongIndex = 0;

        // Visualizer
        let visCanvas = document.getElementById('music-visualizer');
        let visCtx = null;
        let analyser = null;
        let dataArray = null;
        let visualizerRunning = false;
        let animFrameId = null;
        let audioCtx = null;
        let sourceNode = null;
        let musicAudioElement = null; // the actual audio element

        function initVisualizer() {
            if (!visCanvas) return;
            visCanvas.width = visCanvas.clientWidth * window.devicePixelRatio || 260;
            visCanvas.height = visCanvas.clientHeight * window.devicePixelRatio || 60;
            visCtx = visCanvas.getContext('2d');
            visCtx.fillStyle = '#0a0a0a';
            visCtx.fillRect(0, 0, visCanvas.width, visCanvas.height);
        }

        function startVisualizer() {
            if (!state.settings.enabled.music) return;
            if (visualizerRunning) return;
            if (!visCtx) initVisualizer();
            if (!musicAudioElement || !musicAudioElement.src) return;
            try {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                if (sourceNode) {
                    try { sourceNode.disconnect(); } catch (e) {}
                }
                sourceNode = audioCtx.createMediaElementSource(musicAudioElement);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                visualizerRunning = true;
                drawVisualizer();
            } catch (e) {
                console.warn('Visualizer init error:', e);
                visualizerRunning = false;
            }
        }

        function stopVisualizer() {
            visualizerRunning = false;
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
            if (visCtx) {
                visCtx.fillStyle = '#0a0a0a';
                visCtx.fillRect(0, 0, visCanvas.width, visCanvas.height);
            }
            try {
                if (sourceNode) {
                    sourceNode.disconnect();
                    sourceNode = null;
                }
                if (analyser) {
                    analyser.disconnect();
                    analyser = null;
                }
            } catch (e) {}
        }

        function drawVisualizer() {
            if (!visualizerRunning || !analyser || !dataArray) {
                if (visCtx) {
                    visCtx.fillStyle = '#0a0a0a';
                    visCtx.fillRect(0, 0, visCanvas.width, visCanvas.height);
                }
                return;
            }
            analyser.getByteFrequencyData(dataArray);
            const w = visCanvas.width;
            const h = visCanvas.height;
            const barWidth = Math.max(2, w / dataArray.length * 0.8);
            let x = 0;
            visCtx.fillStyle = '#0a0a0a';
            visCtx.fillRect(0, 0, w, h);

            for (let i = 0; i < dataArray.length; i++) {
                const val = dataArray[i];
                const pct = val / 255;
                const brightness = Math.round(pct * 200 + 55);
                const barHeight = pct * h * 0.85;
                visCtx.fillStyle = `rgb(${brightness},${brightness},${brightness})`;
                visCtx.fillRect(x, h - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
            animFrameId = requestAnimationFrame(drawVisualizer);
        }

        // Music player
        function initMusic() {
            const s = state.music;
            musicSongs = s.songs || [];
            const vol = s.volume || 70;
            document.getElementById('music-volume-fill').style.width = vol + '%';
            document.getElementById('music-volume-label').textContent = vol + '%';
            if (musicSongs.length) {
                const idx = s.currentIndex || 0;
                if (idx < musicSongs.length) loadMusicSong(idx);
            }
            renderMusicPlaylist();
            updateMusicNowPlaying();
            document.getElementById('music-count').textContent = musicSongs.length + ' songs';
            initVisualizer();
            if (state.settings.enabled.music && document.getElementById('drawer-music').classList.contains('open')) {
                setTimeout(startVisualizer, 300);
            }
        }

        function loadMusicSong(index) {
            const s = state.music;
            if (!musicSongs.length || index < 0 || index >= musicSongs.length) return;
            s.currentIndex = index;
            currentSongIndex = index;
            const song = musicSongs[index];
            if (!song.file) {
                // Maybe the song was imported from a save without file data – skip
                updateMusicNowPlaying();
                renderMusicPlaylist();
                return;
            }
            // Stop previous audio
            if (musicAudioElement) {
                musicAudioElement.pause();
                musicAudioElement = null;
            }
            // Create new Audio element
            const url = URL.createObjectURL(song.file);
            musicAudioElement = new Audio(url);
            musicAudioElement.volume = (s.volume || 70) / 100;
            // Set up event listeners
            musicAudioElement.addEventListener('ended', () => {
                musicNext();
            });
            musicAudioElement.addEventListener('error', (e) => {
                console.warn('Audio error:', e);
            });
            // Store reference
            musicAudio = musicAudioElement;
            // Update UI
            updateMusicNowPlaying();
            renderMusicPlaylist();
            document.getElementById('music-progress-fill').style.width = '0%';
            document.getElementById('music-elapsed').textContent = '0:00';
            if (song.metadata && song.metadata.duration) {
                document.getElementById('music-total').textContent = formatTime(song.metadata.duration);
            } else {
                document.getElementById('music-total').textContent = '0:00';
            }
            // Restart visualizer with new source
            stopVisualizer();
            if (state.settings.enabled.music && document.getElementById('drawer-music').classList.contains('open')) {
                setTimeout(startVisualizer, 200);
            }
            saveState();
        }

        function updateMusicNowPlaying() {
            const s = state.music;
            const song = musicSongs[s.currentIndex];
            if (!song) {
                document.getElementById('music-title').textContent = '—';
                document.getElementById('music-artist').textContent = '—';
                document.getElementById('music-album').textContent = '—';
                document.getElementById('music-art').innerHTML = '🎵';
                return;
            }
            const meta = song.metadata || {};
            document.getElementById('music-title').textContent = meta.title || '—';
            document.getElementById('music-artist').textContent = meta.artist || '—';
            document.getElementById('music-album').textContent = meta.album || '—';
            if (meta.art) {
                const img = new Image();
                img.onload = () => { document.getElementById('music-art').innerHTML =
                    `<img src="${meta.art}" alt="cover">`; };
                img.onerror = () => { document.getElementById('music-art').innerHTML = '🎵'; };
                img.src = meta.art;
            } else {
                document.getElementById('music-art').innerHTML = '🎵';
            }
            document.getElementById('music-count').textContent = musicSongs.length + ' songs';
        }

        function renderMusicPlaylist() {
            const container = document.getElementById('music-playlist');
            const s = state.music;
            container.innerHTML = '';
            if (!musicSongs.length) {
                container.innerHTML =
                    '<div style="color:#555;padding:4px;text-align:center;font-size:0.8rem;">No songs — load a folder</div>';
                return;
            }
            musicSongs.forEach((song, idx) => {
                const div = document.createElement('div');
                div.className = 'pl-item' + (idx === s.currentIndex ? ' active' : '');
                const meta = song.metadata || {};
                const dur = meta.duration ? formatTime(meta.duration) : '';
                div.innerHTML =
                    `<span>${meta.title || 'Untitled'}</span><span class="dur">${dur}</span>`;
                div.addEventListener('click', () => {
                    if (!musicAudioElement) {
                        loadMusicSong(idx);
                        setTimeout(() => musicTogglePlay(), 200);
                    } else {
                        loadMusicSong(idx);
                        if (musicPlaying) {
                            setTimeout(() => musicAudioElement.play().catch(() => {}), 100);
                        }
                    }
                });
                container.appendChild(div);
            });
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const s = Math.floor(seconds);
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${m}:${String(sec).padStart(2,'0')}`;
        }

        function musicTogglePlay() {
            if (!musicSongs.length) return;
            if (!musicAudioElement) {
                loadMusicSong(currentSongIndex);
                setTimeout(() => musicTogglePlay(), 200);
                return;
            }
            if (musicPlaying) {
                musicAudioElement.pause();
                musicPlaying = false;
                document.getElementById('music-play').textContent = '▶';
                clearInterval(musicProgressInterval);
            } else {
                musicAudioElement.play().catch((err) => {
                    console.warn('Play error:', err);
                    // If play fails, try to resume audio context
                    if (audioCtx && audioCtx.state === 'suspended') {
                        audioCtx.resume().then(() => {
                            musicAudioElement.play().catch(() => {});
                        });
                    }
                });
                musicPlaying = true;
                document.getElementById('music-play').textContent = '⏸';
                startMusicProgress();
                if (!visualizerRunning) startVisualizer();
            }
        }

        function musicStop() {
            if (musicAudioElement) {
                musicAudioElement.pause();
                musicAudioElement.currentTime = 0;
            }
            musicPlaying = false;
            document.getElementById('music-play').textContent = '▶';
            clearInterval(musicProgressInterval);
            document.getElementById('music-progress-fill').style.width = '0%';
            document.getElementById('music-elapsed').textContent = '0:00';
        }

        function musicPrev() {
            if (!musicSongs.length) return;
            const s = state.music;
            const idx = (s.currentIndex - 1 + musicSongs.length) % musicSongs.length;
            loadMusicSong(idx);
            if (musicPlaying) {
                setTimeout(() => musicAudioElement.play().catch(() => {}), 100);
            }
        }

        function musicNext() {
            if (!musicSongs.length) return;
            const s = state.music;
            const idx = (s.currentIndex + 1) % musicSongs.length;
            loadMusicSong(idx);
            if (musicPlaying) {
                setTimeout(() => musicAudioElement.play().catch(() => {}), 100);
            }
        }

        function startMusicProgress() {
            clearInterval(musicProgressInterval);
            musicProgressInterval = setInterval(() => {
                if (!musicAudioElement || !musicAudioElement.duration || isNaN(musicAudioElement.duration) ||
                    musicAudioElement.duration === 0) return;
                const pct = (musicAudioElement.currentTime / musicAudioElement.duration) * 100;
                document.getElementById('music-progress-fill').style.width = pct + '%';
                document.getElementById('music-elapsed').textContent = formatTime(musicAudioElement.currentTime);
                const s = state.music;
                const song = musicSongs[s.currentIndex];
                if (song && song.metadata && !song.metadata.duration) {
                    song.metadata.duration = musicAudioElement.duration;
                    saveState();
                }
            }, 200);
        }

        function musicSetVolume(val) {
            const v = Math.min(100, Math.max(0, val));
            state.music.volume = v;
            if (musicAudioElement) musicAudioElement.volume = v / 100;
            document.getElementById('music-volume-fill').style.width = v + '%';
            document.getElementById('music-volume-label').textContent = v + '%';
            saveState();
        }

        document.getElementById('music-play').addEventListener('click', musicTogglePlay);
        document.getElementById('music-stop').addEventListener('click', musicStop);
        document.getElementById('music-prev').addEventListener('click', musicPrev);
        document.getElementById('music-next').addEventListener('click', musicNext);

        document.getElementById('music-progress-bar').addEventListener('click', (e) => {
            if (!musicAudioElement || !musicAudioElement.duration || isNaN(musicAudioElement.duration) || musicAudioElement
                .duration === 0) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            const time = pct * musicAudioElement.duration;
            musicAudioElement.currentTime = time;
            document.getElementById('music-progress-fill').style.width = pct * 100 + '%';
            document.getElementById('music-elapsed').textContent = formatTime(time);
        });

        document.getElementById('music-volume-bar').addEventListener('click', (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            musicSetVolume(Math.round(pct * 100));
        });

        document.getElementById('music-folder-btn').addEventListener('click', () => {
            document.getElementById('music-file-input').click();
        });

        document.getElementById('music-file-input').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            // Stop current playback
            if (musicAudioElement) {
                musicAudioElement.pause();
                musicAudioElement = null;
            }
            musicPlaying = false;
            document.getElementById('music-play').textContent = '▶';
            clearInterval(musicProgressInterval);
            stopVisualizer();

            musicSongs = [];
            const groups = {};
            const covers = {};
            for (const file of files) {
                const name = file.name.toLowerCase();
                let folder = 'Root';
                if (file.webkitRelativePath) {
                    const parts = file.webkitRelativePath.split('/');
                    if (parts.length > 1) folder = parts.slice(0, -1).join('/');
                }
                if (name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                    if (!covers[folder]) covers[folder] = [];
                    covers[folder].push(file);
                } else if (name.match(/\.(mp3|flac|m4a|ogg|wav|webm)$/i)) {
                    if (!groups[folder]) groups[folder] = [];
                    groups[folder].push(file);
                }
            }
            for (const [folder, audioFiles] of Object.entries(groups)) {
                let coverUrl = null;
                const cl = covers[folder] || [];
                const pref = ['cover.jpg', 'folder.jpg', 'cover.jpeg', 'folder.jpeg', 'album.jpg', 'album.jpeg'];
                let cf = null;
                for (const p of pref) { const found = cl.find(f => f.name.toLowerCase() === p); if (found) { cf = found; break; } }
                if (!cf && cl.length) cf = cl[0];
                if (cf) { try { coverUrl = URL.createObjectURL(cf); } catch (ex) {} }
                for (const file of audioFiles) {
                    const meta = await extractMusicMetadata(file);
                    const art = meta.picture || coverUrl;
                    musicSongs.push({
                        file: file,
                        metadata: {
                            title: meta.title || file.name.replace(/\.[^.]+$/, ''),
                            artist: meta.artist || 'Unknown',
                            album: meta.album || 'Unknown',
                            duration: 0,
                            art: art,
                        }
                    });
                }
            }
            state.music.songs = musicSongs;
            state.music.currentIndex = 0;
            saveState();
            if (musicSongs.length) {
                loadMusicSong(0);
                renderMusicPlaylist();
                updateMusicNowPlaying();
                document.getElementById('music-count').textContent = musicSongs.length + ' songs';
                if (state.settings.enabled.music) {
                    stopVisualizer();
                    setTimeout(startVisualizer, 300);
                }
            }
            e.target.value = '';
        });

        // metadata extraction (support MP3 and M4A)
        async function extractMusicMetadata(file) {
            const result = { title: '', artist: '', album: '', picture: null };
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext === 'mp3') {
                try {
                    const buf = await file.arrayBuffer();
                    const data = new Uint8Array(buf);
                    if (data.length > 10 && data[0] === 0x49 && data[1] === 0x44 && data[2] === 0x33) {
                        const size = (data[6] << 21) | (data[7] << 14) | (data[8] << 7) | data[9];
                        let offset = 10;
                        const end = Math.min(offset + size, data.length);
                        while (offset + 10 < end) {
                            const id = String.fromCharCode(data[offset], data[offset + 1], data[offset + 2], data[offset +
                            3]);
                            const fsize = (data[offset + 4] << 24) | (data[offset + 5] << 16) | (data[offset + 6] << 8) |
                                data[offset + 7];
                            offset += 10;
                            if (offset + fsize > end) break;
                            const frame = data.slice(offset, offset + fsize);
                            const dec = (enc) => {
                                try {
                                    if (enc === 0x00 || enc === 0x03) return new TextDecoder('utf-8').decode(frame
                                        .slice(1)).replace(/\0/g, '').trim();
                                    if (enc === 0x01 || enc === 0x02) return new TextDecoder('utf-16le').decode(
                                        frame.slice(1)).replace(/\0/g, '').trim();
                                    return '';
                                } catch (ex) { return ''; }
                            };
                            if (id === 'TIT2') { const enc = frame[0];
                                result.title = dec(enc); } else if (id === 'TPE1') { const enc = frame[0];
                                result.artist = dec(enc); } else if (id === 'TALB') { const enc = frame[0];
                                result.album = dec(enc); } else if (id === 'APIC') {
                                try {
                                    let pos = 1;
                                    while (pos < frame.length && frame[pos] !== 0) pos++;
                                    pos++;
                                    pos++;
                                    while (pos < frame.length && frame[pos] !== 0) pos++;
                                    pos++;
                                    const pic = frame.slice(pos);
                                    if (pic.length > 1000) {
                                        const blob = new Blob([pic], { type: 'image/jpeg' });
                                        result.picture = URL.createObjectURL(blob);
                                    }
                                } catch (ex) {}
                            }
                            offset += fsize;
                        }
                    }
                } catch (ex) { console.warn('MP3 parse error:', ex); }
            } else if (ext === 'm4a' || ext === 'mp4') {
                try {
                    const buf = await file.arrayBuffer();
                    const data = new Uint8Array(buf);
                    const findAtom = (start, type) => {
                        let pos = start;
                        while (pos + 8 < data.length) {
                            const sz = (data[pos] << 24) | (data[pos + 1] << 16) | (data[pos + 2] << 8) | data[pos + 3];
                            if (sz === 0) break;
                            const t = String.fromCharCode(data[pos + 4], data[pos + 5], data[pos + 6], data[pos + 7]);
                            if (t === type) return pos;
                            pos += sz;
                        }
                        return -1;
                    };
                    const moov = findAtom(0, 'moov');
                    if (moov !== -1) {
                        let pos = moov + 8;
                        while (pos + 8 < data.length) {
                            const sz = (data[pos] << 24) | (data[pos + 1] << 16) | (data[pos + 2] << 8) | data[pos + 3];
                            if (sz === 0) break;
                            const t = String.fromCharCode(data[pos + 4], data[pos + 5], data[pos + 6], data[pos + 7]);
                            if (t === 'udta' || t === 'meta') {
                                let inner = pos + 8;
                                const innerEnd = pos + sz;
                                while (inner + 8 < innerEnd) {
                                    const isz = (data[inner] << 24) | (data[inner + 1] << 16) | (data[inner + 2] << 8) |
                                        data[inner + 3];
                                    if (isz === 0) break;
                                    const it = String.fromCharCode(data[inner + 4], data[inner + 5], data[inner + 6],
                                        data[inner + 7]);
                                    if (it === 'ilst') {
                                        let ilst = inner + 8;
                                        const ilstEnd = inner + isz;
                                        while (ilst + 8 < ilstEnd) {
                                            const isz2 = (data[ilst] << 24) | (data[ilst + 1] << 16) | (data[ilst +
                                                2] << 8) | data[ilst + 3];
                                            if (isz2 === 0) break;
                                            const it2 = String.fromCharCode(data[ilst + 4], data[ilst + 5], data[
                                                ilst + 6], data[ilst + 7]);
                                            let dStart = ilst + 8;
                                            if (dStart + 8 < ilst + isz2) {
                                                const dsz = (data[dStart] << 24) | (data[dStart + 1] << 16) | (
                                                    data[dStart + 2] << 8) | data[dStart + 3];
                                                const dt = String.fromCharCode(data[dStart + 4], data[dStart +
                                                    5], data[dStart + 6], data[dStart + 7]);
                                                if (dt === 'data') {
                                                    const vStart = dStart + 8 + 4;
                                                    const vEnd = dStart + dsz;
                                                    if (vEnd <= data.length && vStart < vEnd) {
                                                        const str = new TextDecoder('utf-8').decode(data
                                                            .slice(vStart, vEnd)).replace(/\0/g, '').trim();
                                                        if (it2 === '\xA9nam') result.title = str;
                                                        else if (it2 === '\xA9ART') result.artist = str;
                                                        else if (it2 === '\xA9alb') result.album = str;
                                                    }
                                                }
                                            }
                                            ilst += isz2;
                                        }
                                        break;
                                    }
                                    inner += isz;
                                }
                                break;
                            }
                            pos += sz;
                        }
                    }
                } catch (ex) { console.warn('M4A parse error:', ex); }
            }
            return result;
        }

        // ================================================================
        // MODAL
        // ================================================================
        document.getElementById('modal-close-btn').addEventListener('click', () => {
            document.getElementById('modal-overlay').classList.remove('open');
        });
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) document.getElementById('modal-overlay').classList.remove('open');
        });

        // ================================================================
        // INIT
        // ================================================================
        loadState();
        applySettings();
        initDimmer();
        initPomodoro();
        initNotes();
        initMusic();
        initResize();
        applyDrawerWidth();

        if (state.settings.enabled.music && document.getElementById('drawer-music').classList.contains('open')) {
            setTimeout(startVisualizer, 300);
        }

        window.addEventListener('beforeunload', () => {
            saveCurrentNote();
            saveState();
            stopVisualizer();
        });

        console.log('⏣ IMP · Integrated Multitool Panel loaded');
        console.log('  📌 Dimmer · Timer · Notes · Music · Settings');
        console.log('  💾 Data saved to localStorage (imti_data)');
        console.log('  🎵 Audio visualizer is greyscale and responds to music');
        console.log('  🟡 Notes highlight is yellow (#ffcc00)');
        console.log('  ↔️  Drawers can be resized by dragging the left edge');
    </script>
</body>
